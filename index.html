<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pelis Extractor V2 - ALFREDO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #050505; color: #fff; text-align: center; padding: 50px; }
        .container { background: #111; padding: 30px; border-radius: 10px; border: 1px solid #ff0000; display: inline-block; }
        button { background: #ff0000; color: #fff; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; border-radius: 5px; }
        #status { margin-top: 20px; color: #aaa; font-family: monospace; }
    </style>
</head>
<body>

    <div class="container">
        <h1>EXTRACTOR PELIS V2</h1>
        <p>Corrección de desencriptación para links de películas.</p>
        <button onclick="procesar()">DESENCRIPTAR Y GUARDAR</button>
        <p id="status">Listo para procesar...</p>
    </div>

    <script>
        const KEY = CryptoJS.enc.Utf8.parse('e72of82ke0gu2o2k');
        const CFG = { mode: CryptoJS.mode.ECB, padding: CryptoJS.pad.Pkcs7 };

        // Función mejorada para limpiar el texto antes de desencriptar
        function cleanDecrypt(cipherText) {
            if (!cipherText || cipherText.length < 20) return cipherText;
            
            try {
                let current = cipherText.trim();
                
                for(let i = 0; i < 2; i++) {
                    // Intentamos desencriptar
                    let bytes = CryptoJS.AES.decrypt(current, KEY, CFG);
                    let result = bytes.toString(CryptoJS.enc.Utf8);
                    
                    if (result && result.includes('http')) {
                        current = result;
                    } else if (result) {
                        current = result;
                    }
                }
                return current;
            } catch (e) {
                return cipherText;
            }
        }

        async function procesar() {
            const status = document.getElementById('status');
            status.innerText = "Descargando pelis.json...";
            
            try {
                const url = 'https://vimetrix.lat/panelpelis/pelis.json';
                const res = await fetch('https://corsproxy.io/?' + encodeURIComponent(url));
                const data = await res.json();
                
                status.innerText = "Procesando doble capa AES...";

                const limpio = data.map(cat => ({
                    ...cat,
                    samples: cat.samples.map(peli => ({
                        ...peli,
                        url: cleanDecrypt(peli.url),
                        // Desencriptamos también los iconos por si acaso
                        icono: cleanDecrypt(peli.icono),
                        iconoHorizontal: cleanDecrypt(peli.iconoHorizontal),
                        iconpng: cleanDecrypt(peli.iconpng)
                    }))
                }));

                const blob = new Blob([JSON.stringify(limpio, null, 4)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'pelis_REQUETE_LIMPIAS.json';
                a.click();
                
                status.innerText = "¡Hecho! Archivo descargado.";
                status.style.color = "#00ff00";
            } catch (e) {
                status.innerText = "Error en la descarga o proceso.";
                status.style.color = "#ff0000";
            }
        }
    </script>
</body>
</html>
