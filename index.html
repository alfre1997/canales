<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Extractor Pelis Vimetrix - ALFREDO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #00ff00; text-align: center; padding: 50px; }
        .card { border: 2px solid #00ff00; padding: 30px; display: inline-block; background: #111; border-radius: 15px; box-shadow: 0 0 20px rgba(0,255,0,0.2); }
        button { background: #00ff00; color: #000; padding: 15px 30px; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; font-size: 16px; transition: 0.3s; }
        button:hover { background: #00cc00; transform: scale(1.05); }
        #status { margin-top: 20px; color: #fff; font-family: monospace; }
        .log { font-size: 12px; color: #666; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>PELIS DECRYPTOR PRO</h1>
        <p style="color: #eee;">Lógica avanzada para el panel de Películas</p>
        <button onclick="procesar()">DESENCRIPTAR Y GUARDAR JSON</button>
        <div id="status">Esperando...</div>
        <div class="log">Llave: e72of82ke0gu2o2k</div>
    </div>

    <script>
        const KEY = CryptoJS.enc.Utf8.parse('e72of82ke0gu2o2k');
        const CFG = { mode: CryptoJS.mode.ECB, padding: CryptoJS.pad.Pkcs7 };

        function desencriptarReal(texto) {
            if (!texto || texto.length < 15) return texto;
            
            try {
                // 1. Limpiar el texto de posibles escapes de barras del JSON
                let limpia = texto.replace(/\\/g, '').trim();
                
                // 2. Intentar desencriptar (Primera Capa)
                let de1 = CryptoJS.AES.decrypt(limpia, KEY, CFG);
                let res1 = de1.toString(CryptoJS.enc.Utf8);
                
                if (res1 && res1.includes('http')) return res1;

                // 3. Intentar Segunda Capa (Doble encriptación del panel)
                if (res1) {
                    let de2 = CryptoJS.AES.decrypt(res1, KEY, CFG);
                    let res2 = de2.toString(CryptoJS.enc.Utf8);
                    if (res2 && res2.includes('http')) return res2;
                }
                
                // Si no devolvió nada útil, retornamos el primer resultado exitoso
                return res1 || texto;
            } catch (e) {
                return texto;
            }
        }

        async function procesar() {
            const status = document.getElementById('status');
            status.innerText = "Conectando con vimetrix.lat...";
            
            try {
                // Usamos el proxy para cargar tu archivo pelis.json
                const url = 'https://vimetrix.lat/panelpelis/pelis.json';
                const res = await fetch('https://corsproxy.io/?' + encodeURIComponent(url));
                const data = await res.json();
                
                status.innerText = "Desencriptando " + data.length + " categorías...";

                const final = data.map(cat => ({
                    ...cat,
                    samples: cat.samples.map(peli => ({
                        ...peli,
                        url: desencriptarReal(peli.url),
                        icono: peli.icono.startsWith('http') ? peli.icono : desencriptarReal(peli.icono),
                        iconoHorizontal: peli.iconoHorizontal.startsWith('http') ? peli.iconoHorizontal : desencriptarReal(peli.iconoHorizontal)
                    }))
                }));

                status.innerText = "¡Completado! Descargando archivo limpio...";
                
                const blob = new Blob([JSON.stringify(final, null, 4)], { type: 'application/json' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'pelis_ALFREDO_limpias.json';
                link.click();
                
                status.style.color = "#00ff00";

            } catch (e) {
                console.error(e);
                status.innerText = "Error: No se pudo procesar el archivo.";
                status.style.color = "#ff4444";
            }
        }
    </script>
</body>
</html>
