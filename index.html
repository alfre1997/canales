<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Desencriptador Oficial - ALFREDO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: #00ff00; text-align: center; padding: 50px; }
        .panel { border: 2px solid #00ff00; padding: 30px; background: #111; border-radius: 12px; display: inline-block; box-shadow: 0 0 15px #00ff00; }
        button { background: #00ff00; color: #000; padding: 15px 30px; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; }
        #status { margin-top: 20px; color: #fff; }
    </style>
</head>
<body>

    <div class="panel">
        <h1>SISTEMA DE DESBLOQUEO ALFREDO</h1>
        <p>Lógica: AES-128-ECB + Base64 (OpenSSL Compatible)</p>
        <button onclick="descifrarConLogicaPHP()">DESENCRIPTAR PELIS.JSON</button>
        <div id="status">Esperando acción...</div>
    </div>

    <script>
        // Clave idéntica a tu define('ENCRYPTION_KEY', 'e72of82ke0gu2o2k');
        const KEY_STR = 'e72of82ke0gu2o2k';
        const KEY = CryptoJS.enc.Utf8.parse(KEY_STR);
        const CFG = { mode: CryptoJS.mode.ECB, padding: CryptoJS.pad.Pkcs7 };

        function decryptPHP(ciphertext) {
            if (!ciphertext || ciphertext.length < 10) return ciphertext;

            try {
                // Paso 1: Limpiar la cadena de escapes que mete el JSON
                let cleanText = ciphertext.replace(/\\/g, '').trim();

                // Paso 2: Revertir el base64_encode(openssl_encrypt(...))
                // CryptoJS.AES.decrypt espera una cadena Base64, así que lo pasamos directo
                let decrypted = CryptoJS.AES.decrypt(cleanText, KEY, CFG);
                let plaintext = decrypted.toString(CryptoJS.enc.Utf8);

                // Paso 3: Si el resultado es vacío o basura, intentar una segunda capa
                // (Por si el script PHP se ejecutó dos veces)
                if (!plaintext || !plaintext.includes('http')) {
                    let secondTry = CryptoJS.AES.decrypt(plaintext || cleanText, KEY, CFG);
                    let finalTxt = secondTry.toString(CryptoJS.enc.Utf8);
                    if (finalTxt.includes('http')) return finalTxt;
                }

                return plaintext || ciphertext;
            } catch (e) {
                return ciphertext;
            }
        }

        async function descifrarConLogicaPHP() {
            const status = document.getElementById('status');
            status.innerText = "Descargando pelis.json desde vimetrix...";

            try {
                // Obtenemos el JSON directamente de tu servidor
                const url = 'https://vimetrix.lat/panelpelis/pelis.json';
                const response = await fetch('https://corsproxy.io/?' + encodeURIComponent(url));
                const json = await response.json();

                status.innerText = "Aplicando algoritmo OpenSSL inverso...";

                const dataLimpia = json.map(categoria => ({
                    ...categoria,
                    samples: categoria.samples.map(peli => ({
                        ...peli,
                        // Aplicamos la lógica a la URL y a los iconos si estuvieran cifrados
                        url: decryptPHP(peli.url),
                        icono: peli.icono.includes('http') ? peli.icono : decryptPHP(peli.icono),
                        iconoHorizontal: peli.iconoHorizontal.includes('http') ? peli.iconoHorizontal : decryptPHP(peli.iconoHorizontal)
                    }))
                }));

                status.innerText = "¡Proceso terminado con éxito!";

                // Generamos el archivo para descargar
                const blob = new Blob([JSON.stringify(dataLimpia, null, 4)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'pelis_ALFREDO_funcional.json';
                a.click();

            } catch (err) {
                status.innerText = "Error: No se pudo acceder al archivo.";
                console.error(err);
            }
        }
    </script>
</body>
</html>
