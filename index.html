<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Extractor Pelis NIVEL DIOS - ALFREDO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #050505; color: #00ff00; text-align: center; padding: 50px; }
        .box { border: 2px solid #00ff00; padding: 40px; background: #111; border-radius: 15px; display: inline-block; box-shadow: 0 0 30px rgba(0,255,0,0.2); }
        button { background: #00ff00; color: #000; padding: 15px 40px; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; font-size: 1.2rem; }
        #status { margin-top: 25px; color: #fff; font-family: monospace; border-top: 1px solid #333; padding-top: 15px; }
    </style>
</head>
<body>

    <div class="box">
        <h1>PELIS DECRYPTOR ULTRA</h1>
        <p style="color:#888">Eliminando triple capa AES del panel Vimetrix</p>
        <button onclick="superProcesar()">INICIAR EXTRACCIÓN</button>
        <div id="status">Esperando...</div>
    </div>

    <script>
        const KEY = CryptoJS.enc.Utf8.parse('e72of82ke0gu2o2k');
        const CFG = { mode: CryptoJS.mode.ECB, padding: CryptoJS.pad.Pkcs7 };

        function recursivoAES(str, intentos = 0) {
            if (!str || intentos > 5) return str;
            
            try {
                // 1. Limpiar basura de escapes del JSON PHP
                let limpia = str.replace(/\\/g, '').trim();
                
                // 2. Intentar desencriptar
                let bytes = CryptoJS.AES.decrypt(limpia, KEY, CFG);
                let desc = bytes.toString(CryptoJS.enc.Utf8);

                // 3. Si el resultado tiene http, éxito total
                if (desc && desc.includes('http')) {
                    return desc;
                } 
                
                // 4. Si el resultado parece ser OTRA capa encriptada (como N1g2...), reintentamos
                if (desc && desc.length > 10 && desc !== str) {
                    return recursivoAES(desc, intentos + 1);
                }

                // 5. Si falla AES, probar Base64 puro por si acaso
                try {
                    let b64 = atob(limpia);
                    if (b64.includes('http')) return b64;
                } catch(e) {}

            } catch (e) {
                return str;
            }
            return str;
        }

        async function superProcesar() {
            const status = document.getElementById('status');
            status.innerText = "Descargando pelis.json de vimetrix...";

            try {
                const res = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://vimetrix.lat/panelpelis/pelis.json'));
                const data = await res.json();
                
                status.innerText = "Procesando capas recursivas...";

                const final = data.map(cat => ({
                    ...cat,
                    samples: cat.samples.map(p => {
                        console.log("Procesando: " + p.name);
                        return {
                            ...p,
                            url: recursivoAES(p.url),
                            icono: recursivoAES(p.icono),
                            iconoHorizontal: recursivoAES(p.iconoHorizontal)
                        };
                    })
                }));

                status.innerText = "¡LIMPIEZA TOTAL! Descargando...";
                
                const blob = new Blob([JSON.stringify(final, null, 4)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'pelis_ALFREDO_funcional_REAL.json';
                a.click();
                
                status.style.color = "#00ff00";
            } catch (err) {
                status.innerText = "Error crítico. Revisa el proxy.";
                status.style.color = "#ff0000";
            }
        }
    </script>
</body>
</html>
