<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Desencriptador Final Pelis - ALFREDO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: #00ff00; text-align: center; padding: 50px; }
        .container { border: 2px solid #00ff00; padding: 30px; display: inline-block; background: #111; border-radius: 10px; }
        button { background: #00ff00; color: #000; padding: 15px 30px; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; }
        #status { margin-top: 20px; color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <h1>REPARADOR DE ENLACES PELIS</h1>
    <p>Este script utiliza la lógica exacta del panel Vimetrix.</p>
    <button onclick="procesar()">DESENCRIPTAR AHORA</button>
    <div id="status">Listo.</div>
</div>

<script>
    // La KEY exacta del archivo .env y panel peli.php
    const MASTER_KEY = CryptoJS.enc.Utf8.parse('e72of82ke0gu2o2k');
    const MASTER_CFG = { mode: CryptoJS.mode.ECB, padding: CryptoJS.pad.Pkcs7 };

    function desencriptarVimetrix(input) {
        if (!input || input.length < 10) return input;
        
        try {
            // 1. Limpiar caracteres de escape del JSON (\/)
            let raw = input.replace(/\\/g, '').trim();
            
            // 2. Primera pasada de AES
            let step1 = CryptoJS.AES.decrypt(raw, MASTER_KEY, MASTER_CFG);
            let res1 = step1.toString(CryptoJS.enc.Utf8);
            
            if (!res1) return input;

            // 3. SEGUNDA PASADA: Aquí es donde fallaba antes. 
            // El panel de pelis SIEMPRE aplica dos veces el cifrado sobre la URL final.
            let step2 = CryptoJS.AES.decrypt(res1, MASTER_KEY, MASTER_CFG);
            let res2 = step2.toString(CryptoJS.enc.Utf8);

            // Si el resultado de la segunda vuelta contiene "http", es el link real.
            if (res2 && res2.includes('http')) {
                return res2;
            }
            
            return res1; // Si solo tenía una capa
        } catch (e) {
            return input;
        }
    }

    async function procesar() {
        const status = document.getElementById('status');
        status.innerText = "Cargando archivo...";

        try {
            const url = 'https://vimetrix.lat/panelpelis/pelis.json';
            const res = await fetch('https://corsproxy.io/?' + encodeURIComponent(url));
            const data = await res.json();

            status.innerText = "Desencriptando enlaces (doble capa)...";

            const cleaned = data.map(cat => ({
                ...cat,
                samples: cat.samples.map(p => ({
                    ...p,
                    url: desencriptarVimetrix(p.url),
                    icono: p.icono.includes('http') ? p.icono : desencriptarVimetrix(p.icono)
                }))
            }));

            // Generar el nuevo JSON
            const blob = new Blob([JSON.stringify(cleaned, null, 4)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'pelis_ALFREDO_LISTAS.json';
            a.click();
            
            status.innerText = "¡ÉXITO! Archivo descargado.";
            status.style.color = "#00ff00";
        } catch (e) {
            status.innerText = "Error de conexión con el panel.";
            status.style.color = "#ff0000";
        }
    }
</script>

</body>
</html>
